# Fly.io:  fly launch --no-deploy --copy-config   (cambia "app" por un nombre único)
#          fly volumes create datos --size 1 --region qro
#          fly secrets set ADMIN_PASSWORD='una-clave-larga'
#          fly deploy
app = "anotador-pictogramas"
primary_region = "qro"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8000"
  SENTENCES_PER_STUDENT = "15"

[mounts]
  source = "datos"
  destination = "/data"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "30s"
    interval = "30s"
    method = "GET"
    path = "/healthz"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
